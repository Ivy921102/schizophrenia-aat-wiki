<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bunnyCheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowBunny" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Fluffy Tail -->
  <circle cx="50" cy="155" r="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>

  <!-- Body -->
  <ellipse cx="100" cy="146" rx="44" ry="38" fill="#ffffff" stroke="#94a3b8" stroke-width="3" filter="url(#shadowBunny)"/>

  <!-- Paws holding a clover / carrot -->
  <ellipse cx="82" cy="172" rx="12" ry="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
  <ellipse cx="118" cy="172" rx="12" ry="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Four Leaf Clover in paws -->
  <g transform="translate(100, 158) scale(0.8)">
    <circle cx="-6" cy="-6" r="6" fill="#10b981"/>
    <circle cx="6" cy="-6" r="6" fill="#10b981"/>
    <circle cx="-6" cy="6" r="6" fill="#10b981"/>
    <circle cx="6" cy="6" r="6" fill="#10b981"/>
    <path d="M 0 0 Q 3 14 0 20" stroke="#059669" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Big Long Floppy Ears -->
  <path d="M 72 65 C 55 40 45 10 65 8 C 85 6 88 40 82 65 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <path d="M 70 55 C 60 38 54 18 66 16 C 78 14 80 38 77 55 Z" fill="#fce7f3"/>

  <path d="M 128 65 C 145 40 155 10 135 8 C 115 6 112 40 118 65 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <path d="M 130 55 C 140 38 146 18 134 16 C 122 14 120 38 123 55 Z" fill="#fce7f3"/>

  <!-- Head -->
  <circle cx="100" cy="90" r="44" fill="#ffffff" stroke="#94a3b8" stroke-width="3" filter="url(#shadowBunny)"/>

  <!-- Cheeks -->
  <circle cx="70" cy="100" r="10" fill="url(#bunnyCheek)"/>
  <circle cx="130" cy="100" r="10" fill="url(#bunnyCheek)"/>

  <!-- Big Sparkling Brown/Ruby Eyes -->
  <ellipse cx="80" cy="85" rx="7" ry="9" fill="#831843"/>
  <ellipse cx="120" cy="85" rx="7" ry="9" fill="#831843"/>
  <circle cx="78" cy="82" r="3" fill="#ffffff"/>
  <circle cx="83" cy="87" r="1.5" fill="#ffffff"/>
  <circle cx="118" cy="82" r="3" fill="#ffffff"/>
  <circle cx="123" cy="87" r="1.5" fill="#ffffff"/>

  <!-- Nose & Mouth -->
  <polygon points="97,94 103,94 100,97" fill="#f43f5e"/>
  <path d="M 96 98 Q 100 101 100 102 Q 100 101 104 98" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Cute flower on ear -->
  <circle cx="124" cy="58" r="6" fill="#f472b6"/>
  <circle cx="124" cy="58" r="2.5" fill="#fef08a"/>
</svg>
