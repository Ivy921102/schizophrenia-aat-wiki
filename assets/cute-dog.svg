<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="dogCheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Tail wagging -->
  <path d="M 45 130 C 25 110 20 85 35 75 C 45 70 50 85 48 105" fill="#f59e0b" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <!-- Tail wag marks -->
  <path d="M 18 70 C 15 78 18 86 20 90" stroke="#fcd34d" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 12 80 C 10 88 12 94 15 98" stroke="#fcd34d" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Body -->
  <ellipse cx="100" cy="140" rx="48" ry="40" fill="#fbbf24" stroke="#d97706" stroke-width="3.5" filter="url(#softShadow)"/>

  <!-- Therapy Vest -->
  <path d="M 68 125 Q 100 115 132 125 Q 138 155 130 168 Q 100 174 70 168 Q 62 155 68 125 Z" fill="#0d9488" stroke="#0f766e" stroke-width="3"/>
  <!-- Vest Collar Strap -->
  <path d="M 72 126 Q 100 135 128 126" stroke="#fef08a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Therapy Badge / Cross on Vest -->
  <circle cx="100" cy="148" r="12" fill="#ffffff" filter="url(#softShadow)"/>
  <path d="M 100 141 L 100 155 M 93 148 L 107 148" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Front Paws -->
  <ellipse cx="80" cy="175" rx="14" ry="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <ellipse cx="120" cy="175" rx="14" ry="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <!-- Paw Toe Lines -->
  <path d="M 76 178 L 76 182 M 84 178 L 84 182" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <path d="M 116 178 L 116 182 M 124 178 L 124 182" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>

  <!-- Ears (Behind head or flopped) -->
  <path d="M 52 65 C 30 75 25 115 42 125 C 55 132 65 110 60 85 Z" fill="#d97706" stroke="#b45309" stroke-width="3"/>
  <path d="M 148 65 C 170 75 175 115 158 125 C 145 132 135 110 140 85 Z" fill="#d97706" stroke="#b45309" stroke-width="3"/>

  <!-- Head -->
  <circle cx="100" cy="80" r="46" fill="#fbbf24" stroke="#d97706" stroke-width="3.5" filter="url(#softShadow)"/>

  <!-- Cheeks -->
  <circle cx="68" cy="92" r="10" fill="url(#dogCheek)"/>
  <circle cx="132" cy="92" r="10" fill="url(#dogCheek)"/>

  <!-- Eyes -->
  <ellipse cx="78" cy="74" rx="7" ry="9" fill="#1e1b4b"/>
  <ellipse cx="122" cy="74" rx="7" ry="9" fill="#1e1b4b"/>
  <!-- Eye Sparkles -->
  <circle cx="76" cy="71" r="3" fill="#ffffff"/>
  <circle cx="81" cy="76" r="1.5" fill="#ffffff"/>
  <circle cx="120" cy="71" r="3" fill="#ffffff"/>
  <circle cx="125" cy="76" r="1.5" fill="#ffffff"/>

  <!-- Eyebrows (Cute dots) -->
  <circle cx="75" cy="60" r="3.5" fill="#d97706"/>
  <circle cx="125" cy="60" r="3.5" fill="#d97706"/>

  <!-- Snout / Muzzle Area -->
  <ellipse cx="100" cy="92" rx="20" ry="15" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  
  <!-- Nose -->
  <path d="M 94 85 C 94 82 106 82 106 85 C 106 89 101 93 100 93 C 99 93 94 89 94 85 Z" fill="#1e1b4b"/>
  <circle cx="98" cy="84" r="1" fill="#ffffff"/>

  <!-- Mouth & Happy Tongue -->
  <path d="M 95 93 Q 100 97 100 99 Q 100 97 105 93" stroke="#1e1b4b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Tongue sticking out happily -->
  <path d="M 97 98 C 97 107 103 107 103 98 Z" fill="#f43f5e" stroke="#e11d48" stroke-width="1.5"/>

  <!-- Little Heart Floating Above -->
  <path d="M 140 32 C 140 25 148 22 153 27 C 158 22 166 25 166 32 C 166 42 153 48 153 48 C 153 48 140 42 140 32 Z" fill="#f43f5e" opacity="0.85"/>
</svg>
