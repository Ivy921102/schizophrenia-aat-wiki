<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="cheekHeart" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowHeart" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Tail with heart wag -->
  <path d="M 45 130 C 25 110 20 85 35 75 C 45 70 50 85 48 105" fill="#f59e0b" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="100" cy="142" rx="46" ry="38" fill="#fbbf24" stroke="#d97706" stroke-width="3.5" filter="url(#shadowHeart)"/>

  <!-- Big Red Heart held in arms -->
  <path d="M 100 125 C 80 95 45 110 55 140 C 65 170 100 185 100 185 C 100 185 135 170 145 140 C 155 110 120 95 100 125 Z" fill="#ef4444" stroke="#dc2626" stroke-width="3" filter="url(#shadowHeart)"/>
  <!-- Heart shine -->
  <path d="M 68 122 C 60 130 62 142 66 148" stroke="#fca5a5" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Dog Paws Hugging Heart -->
  <ellipse cx="65" cy="145" rx="11" ry="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" transform="rotate(-20 65 145)"/>
  <ellipse cx="135" cy="145" rx="11" ry="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" transform="rotate(20 135 145)"/>

  <!-- Floppy Ears -->
  <path d="M 52 65 C 30 75 25 115 42 125 C 55 132 65 110 60 85 Z" fill="#d97706" stroke="#b45309" stroke-width="3"/>
  <path d="M 148 65 C 170 75 175 115 158 125 C 145 132 135 110 140 85 Z" fill="#d97706" stroke="#b45309" stroke-width="3"/>

  <!-- Head with slight tilt -->
  <circle cx="100" cy="80" r="46" fill="#fbbf24" stroke="#d97706" stroke-width="3.5" filter="url(#shadowHeart)"/>

  <!-- Cheeks -->
  <circle cx="68" cy="92" r="10" fill="url(#cheekHeart)"/>
  <circle cx="132" cy="92" r="10" fill="url(#cheekHeart)"/>

  <!-- Loving Sparkling Eyes (Happy winking or big stars) -->
  <ellipse cx="78" cy="74" rx="7" ry="9" fill="#1e1b4b"/>
  <ellipse cx="122" cy="74" rx="7" ry="9" fill="#1e1b4b"/>
  <circle cx="76" cy="71" r="3" fill="#ffffff"/>
  <circle cx="81" cy="76" r="1.5" fill="#ffffff"/>
  <circle cx="120" cy="71" r="3" fill="#ffffff"/>
  <circle cx="125" cy="76" r="1.5" fill="#ffffff"/>

  <!-- Snout -->
  <ellipse cx="100" cy="93" rx="18" ry="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <path d="M 95 87 C 95 84 105 84 105 87 C 105 90 101 93 100 93 C 99 93 95 90 95 87 Z" fill="#1e1b4b"/>
  <path d="M 96 94 Q 100 97 100 99 Q 100 97 104 94" stroke="#1e1b4b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 97 99 C 97 106 103 106 103 99 Z" fill="#f43f5e" stroke="#e11d48" stroke-width="1.5"/>

  <!-- Small floating sparkles -->
  <path d="M 148 45 L 150 49 L 154 49 L 151 52 L 152 56 L 148 53 L 144 56 L 145 52 L 142 49 L 146 49 Z" fill="#f59e0b"/>
  <path d="M 52 45 L 54 49 L 58 49 L 55 52 L 56 56 L 52 53 L 48 56 L 49 52 L 46 49 L 50 49 Z" fill="#f59e0b"/>
</svg>
